<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <meta
      name="description"
      content="Zet ‘Webpagina opslaan als PDF’ vast op de werkbalk van Chrome en sla webpagina’s op als PDF."
    >
    <title>‘Webpagina opslaan als PDF’ is geïnstalleerd! Zo ga je aan de slag.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/pdf-icon-32.png">
    <link rel="stylesheet" href="styles.css?v=nl-label-1">
  </head>
  <body>
    <main class="page">
      <header class="intro" aria-labelledby="welcome-title">
        <h1 id="welcome-title">
          <span class="headline-main">
            <span class="headline-product">
              <img class="headline-mascot" src="assets/mascot-heading-128x64.png" width="128" height="64" alt="" aria-hidden="true">
              <span>‘Webpagina opslaan als PDF’</span>
            </span>
            <span class="headline-keep">is geïnstalleerd!&nbsp;🎉</span>
          </span>
          <span class="headline-sub">Zo ga je aan de slag.</span>
        </h1>
      </header>

      <section class="instruction" aria-labelledby="pin-step">
        <h2 class="step" id="pin-step">
          Open het menu Extensies (1) rechtsboven in Chrome. Klik vervolgens op het speldpictogram (2) naast ‘Webpagina opslaan als PDF’.
        </h2>
        <figure class="browser-shot browser-shot--localized">
          <img src="assets/pin-extension.png" alt="Het menu Extensies in Chrome met de optie om ‘Webpagina opslaan als PDF’ vast te zetten op de werkbalk">
          <svg class="localized-label" viewBox="0 0 2600 1193" aria-hidden="true" focusable="false">
            <rect x="1848" y="463" width="335" height="42" fill="#fafbfc" />
            <text x="1854" y="496" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="24">Webpagina opslaan als PDF</text>
          </svg>
        </figure>
      </section>

      <section class="instruction instruction--last" aria-labelledby="open-step">
        <h2 class="step" id="open-step">
          Klaar! Klik op het PDF-pictogram (3) op de werkbalk wanneer je een webpagina wilt opslaan.
        </h2>
        <figure class="browser-shot">
          <img src="assets/open-extension.png" alt="Het PDF-pictogram van ‘Webpagina opslaan als PDF’ op de werkbalk van Chrome">
        </figure>
      </section>
    </main>
  </body>
</html>
